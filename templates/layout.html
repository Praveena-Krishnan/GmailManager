<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zentra - Intelligent Inbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      body { display: flex; min-height: 100vh; background-color: #1a1c20; color: #dee2e6; }
      .sidebar { width: 260px; flex-shrink: 0; background-color: #212529; padding: 1.5rem 1rem; }
      .main-content { flex-grow: 1; padding: 2rem; overflow-y: auto; }
      .nav-link { color: #adb5bd; font-size: 1.1rem; margin-bottom: 0.5rem; }
      .nav-link.active, .nav-link:hover { color: #fff; background-color: #343a40; border-radius: 0.5rem; }
      .sidebar-header { font-size: 1.5rem; font-weight: bold; color: #fff; margin-bottom: 2rem; }

      /* --- ADD THIS NEW RULE HERE --- */
      .highlight {
        background-color: #f0ad4e; /* A lighter, more muted yellow/orange */
        color: #fff;             /* White text for better contrast */
        padding: 0.1em 0.4em;
        border-radius: 0.2rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="sidebar d-flex flex-column">
      <div class="sidebar-header">Zentra</div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active" href="/recent_classified"><i class="bi bi-inbox-fill me-2"></i> Inbox</a>
        </li>
      </ul>
    </div>
    <div class="main-content">
      {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
